<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img">
  <defs>
    <radialGradient id="au_taro" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fffdf0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd08a" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#ff8c42" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e0453f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin_taro" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="60%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </radialGradient>
    <linearGradient id="mn_taro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#db3a2c"/>
      <stop offset="50%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#b02a21"/>
    </linearGradient>
    <linearGradient id="mn_taro_shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#db3a2c" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sv_taro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff8e1"/>
      <stop offset="70%" stop-color="#ffecb3"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
    <linearGradient id="ac_taro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c73a2a"/>
      <stop offset="100%" stop-color="#92231b"/>
    </linearGradient>
    <linearGradient id="timer_taro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6f00"/>
      <stop offset="50%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
    <linearGradient id="timer_taro_blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="50%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <linearGradient id="timer_taro_red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="50%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>
    <linearGradient id="silver_taro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="50%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <linearGradient id="taro_horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="50%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <filter id="glow_taro" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(20,24,36,0.25)"/>
    </filter>
    <filter id="fire_glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0  0 0.7 0 0 0  0 0 0.3 0 0  0 0 0 1.8 0"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景光环（火焰感） -->
  <ellipse cx="200" cy="200" rx="150" ry="140" fill="url(#au_taro)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="150;170;150" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="140;160;140" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 主体组 -->
  <g filter="url(#soft_shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <g transform="translate(0, 10)">
      
      <!-- 双腿（泰罗特有的护腿装甲） -->
      <g>
        <path d="M138 350 Q130 380 125 400 L148 400 Q152 380 145 350 Z" fill="url(#mn_taro)" stroke="rgba(20,24,36,0.3)" stroke-width="1.5"/>
        <path d="M138 350 Q142 370 140 385 L148 385 Q145 370 145 350 Z" fill="url(#sv_taro)"/>
        <ellipse cx="141.5" cy="390" rx="8" ry="4" fill="url(#ac_taro)"/>
        <!-- 护腿装甲 -->
        <path d="M130 340 Q135 360 132 380 L150 380 Q148 360 152 340 Z" fill="url(#mn_taro)" opacity="0.7"/>
        <path d="M252 350 Q260 380 265 400 L242 400 Q238 380 245 350 Z" fill="url(#mn_taro)" stroke="rgba(20,24,36,0.3)" stroke-width="1.5"/>
        <path d="M252 350 Q248 370 250 385 L242 385 Q245 370 245 350 Z" fill="url(#sv_taro)"/>
        <ellipse cx="248.5" cy="390" rx="8" ry="4" fill="url(#ac_taro)"/>
        <path d="M240 340 Q245 360 248 380 L266 380 Q264 360 268 340 Z" fill="url(#mn_taro)" opacity="0.7"/>
      </g>

      <!-- 躯干主体 -->
      <path d="M120 300 Q110 260 120 220 Q125 190 150 180 Q180 170 200 170 Q220 170 250 180 Q275 190 280 220 Q290 260 280 300 Z" fill="url(#skin_taro)" stroke="rgba(20,24,36,0.15)" stroke-width="1">
        <animate attributeName="d" values="M120 300 Q110 260 120 220 Q125 190 150 180 Q180 170 200 170 Q220 170 250 180 Q275 190 280 220 Q290 260 280 300 Z;
                      M120 300 Q110 260 120 215 Q125 185 150 175 Q180 165 200 165 Q220 165 250 175 Q275 185 280 215 Q290 255 280 300 Z;
                      M120 300 Q110 260 120 220 Q125 190 150 180 Q180 170 200 170 Q220 170 250 180 Q275 190 280 220 Q290 260 280 300 Z" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </path>

      <!-- 泰罗特有的V字胸甲（红色为主，带金色边框） -->
      <path d="M165 240 Q200 200 235 240 Q215 260 200 275 Q185 260 165 240 Z" fill="url(#mn_taro)">
        <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M173 245 Q200 208 227 245 Q210 262 200 272 Q190 262 173 245 Z" fill="url(#mn_taro_shine)" opacity="0.6"/>
      <!-- 中央金色宝石 -->
      <ellipse cx="200" cy="255" rx="14" ry="12" fill="url(#taro_horn)" stroke="#b8860b" stroke-width="2">
        <animate attributeName="rx" values="14;16;14" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="12;14;12" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="200" cy="255" rx="8" ry="7" fill="#ffd600" opacity="0.9">
        <animate attributeName="opacity" values="0.9;1;0.6;1;0.9" dur="1.5s" repeatCount="indefinite"/>
      </ellipse>

      <!-- 色光定时器（橙红 -> 蓝 -> 红） -->
      <g id="colorTimer">
        <ellipse cx="200" cy="248" rx="22" ry="20" fill="url(#timer_taro)" stroke="#3d0f00" stroke-width="2.5">
          <animate attributeName="rx" values="22;25;22" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="ry" values="20;23;20" dur="1.2s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="200" cy="248" rx="15" ry="13" fill="url(#timer_taro)" opacity="0.9">
          <animate attributeName="opacity" values="0.9;1;0.6;1;0.9" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="rx" values="15;17;14;17;15" dur="2s" repeatCount="indefinite"/>
        </ellipse>
        <animate attributeName="fill" values="url(#timer_taro);url(#timer_taro);url(#timer_taro_red);url(#timer_taro_blue);url(#timer_taro)" dur="15s" repeatCount="indefinite" begin="3s"/>
      </g>

      <!-- 胸部金色护甲条 -->
      <path d="M150 200 Q180 192 200 192 Q220 192 250 200 L245 212 Q220 205 200 205 Q180 205 155 212 Z" fill="url(#silver_taro)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" opacity="0.95"/>

      <!-- 双肩装甲（泰罗特有的宽大护肩） -->
      <path d="M110 195 Q90 185 80 205 Q90 225 110 225 Q105 205 110 195 Z" fill="url(#mn_taro)" stroke="rgba(20,24,36,0.2)" stroke-width="1.5"/>
      <path d="M290 195 Q310 185 320 205 Q310 225 290 225 Q295 205 290 195 Z" fill="url(#mn_taro)" stroke="rgba(20,24,36,0.2)" stroke-width="1.5"/>
      <path d="M108 202 Q125 202 140 210" stroke="url(#silver_taro)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M292 202 Q275 202 260 210" stroke="url(#silver_taro)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

      <!-- 双臂 -->
      <g>
        <path d="M110 215 Q90 235 85 270 Q88 290 110 300 Q125 285 125 245 Q120 225 110 215 Z" fill="url(#skin_taro)" stroke="rgba(20,24,36,0.15)" stroke-width="1"/>
        <path d="M110 215 Q102 230 100 248 L120 248 Q123 230 110 215 Z" fill="url(#sv_taro)"/>
        <path d="M95 295 Q88 312 95 325 L115 325 Q120 312 112 295 Z" fill="url(#ac_taro)"/>
        <path d="M290 215 Q310 235 315 270 Q312 290 290 300 Q275 285 275 245 Q280 225 290 215 Z" fill="url(#skin_taro)" stroke="rgba(20,24,36,0.15)" stroke-width="1"/>
        <path d="M290 215 Q298 230 300 248 L280 248 Q277 230 290 215 Z" fill="url(#sv_taro)"/>
        <path d="M305 295 Q312 312 305 325 L285 325 Q280 312 288 295 Z" fill="url(#ac_taro)"/>
      </g>

      <!-- 颈部 -->
      <path d="M165 175 L160 192 L240 192 L235 175 Z" fill="url(#skin_taro)"/>

      <!-- 头部 -->
      <g>
        <path d="M135 170 Q125 135 140 95 Q165 70 200 65 Q235 70 260 95 Q275 135 265 170 Z" fill="url(#skin_taro)" stroke="rgba(20,24,36,0.15)" stroke-width="1">
          <animate attributeName="d" values="M135 170 Q125 135 140 95 Q165 70 200 65 Q235 70 260 95 Q275 135 265 170 Z;
                        M135 170 Q125 132 140 92 Q165 67 200 62 Q235 67 260 92 Q275 132 265 170 Z;
                        M135 170 Q125 135 140 95 Q165 70 200 65 Q235 70 260 95 Q275 135 265 170 Z" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
        </path>

        <!-- 面部护甲（泰罗特有的额头角 + 面部线条） -->
        <path d="M150 150 Q160 122 180 105 Q195 98 205 105 Q215 98 220 105 Q240 122 250 150" fill="none" stroke="url(#silver_taro)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <path d="M153 153 Q163 125 183 108 Q198 101 208 108 Q218 101 223 108 Q242 125 252 153" fill="none" stroke="#fff8e1" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

        <!-- 眼睛（泰罗的眼睛是蓝色，威严） -->
        <g>
          <ellipse cx="170" cy="128" rx="13" ry="11" fill="#051025" filter="url(#glow_taro)">
            <animate attributeName="ry" values="11;2;11" dur="4s" repeatCount="indefinite" begin="0.5s"/>
          </ellipse>
          <ellipse cx="170" cy="128" rx="8" ry="7" fill="#29b6f6">
            <animate attributeName="ry" values="7;1;7" dur="4s" repeatCount="indefinite" begin="0.5s"/>
          </ellipse>
          <ellipse cx="173" cy="126" rx="3" ry="2.5" fill="#ffffff" opacity="0.95"/>
          <ellipse cx="167" cy="130" rx="1.5" ry="1" fill="#ffffff" opacity="0.5"/>
          <ellipse cx="230" cy="128" rx="13" ry="11" fill="#051025" filter="url(#glow_taro)">
            <animate attributeName="ry" values="11;2;11" dur="4s" repeatCount="indefinite" begin="0.5s"/>
          </ellipse>
          <ellipse cx="230" cy="128" rx="8" ry="7" fill="#29b6f6">
            <animate attributeName="ry" values="7;1;7" dur="4s" repeatCount="indefinite" begin="0.5s"/>
          </ellipse>
          <ellipse cx="233" cy="126" rx="3" ry="2.5" fill="#ffffff" opacity="0.95"/>
          <ellipse cx="227" cy="130" rx="1.5" ry="1" fill="#ffffff" opacity="0.5"/>
        </g>

        <!-- 头顶角（泰罗特有的双角） -->
        <path d="M175 85 Q185 45 195 85 Q192 92 185 98 Q178 92 175 85 Z" fill="url(#taro_horn)" stroke="#b8860b" stroke-width="2" filter="url(#fire_glow)">
          <animateTransform attributeName="transform" type="rotate" values="0;2;0;-2;0" dur="5s" repeatCount="indefinite"/>
        </path>
        <path d="M205 85 Q215 45 225 85 Q222 92 215 98 Q208 92 205 85 Z" fill="url(#taro_horn)" stroke="#b8860b" stroke-width="2" filter="url(#fire_glow)">
          <animateTransform attributeName="transform" type="rotate" values="0;-2;0;2;0" dur="5s" repeatCount="indefinite"/>
        </path>
        <!-- 角的高光 -->
        <path d="M178 88 Q188 58 195 88 Q193 94 185 96 Q177 94 178 88 Z" fill="url(#mn_taro_shine)" opacity="0.4"/>
        <path d="M208 88 Q218 58 222 88 Q219 94 215 96 Q207 94 208 88 Z" fill="url(#mn_taro_shine)" opacity="0.4"/>

        <!-- 耳部装饰 -->
        <path d="M135 140 Q118 135 110 155 Q120 155 132 148 Q138 142 135 140 Z" fill="url(#sv_taro)" stroke="url(#silver_taro)" stroke-width="1"/>
        <path d="M265 140 Q282 135 290 155 Q280 155 268 148 Q262 142 265 140 Z" fill="url(#sv_taro)" stroke="url(#silver_taro)" stroke-width="1"/>

        <!-- 额头宝石（红色） -->
        <ellipse cx="200" cy="112" rx="7" ry="6" fill="#d32f2f" filter="url(#fire_glow)">
          <animate attributeName="opacity" values="0.9;1;0.9" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="rx" values="7;8;7" dur="1.5s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- 火焰粒子效果 -->
      <g opacity="0.7">
        <circle cx="170" cy="200" r="4" fill="#ff6f00">
          <animate attributeName="r" values="2;6;2" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.4;1;0" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="200;170;200" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="230" cy="200" r="4" fill="#ff6f00">
          <animate attributeName="r" values="2;6;2" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
          <animate attributeName="opacity" values="0.4;1;0" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
          <animate attributeName="cy" values="200;170;200" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
        </circle>
        <circle cx="200" cy="160" r="3" fill="#ffd600">
          <animate attributeName="r" values="2;5;2" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;1;0" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="160;130;160" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="200" cy="180" r="2" fill="#ff5722">
          <animate attributeName="r" values="1;4;1" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;1;0" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="180;150;180" dur="0.8s" repeatCount="indefinite"/>
        </circle>
      </g>

    </g>
  </g>

  <!-- 火焰粒子环绕 -->
  <g filter="url(#glow_taro)">
    <circle cx="120" cy="280" r="5" fill="#ff6f00" opacity="0.6">
      <animateMotion path="M0,0 Q-40,-50 -30,-100 Q15,-130 50,-70 Q70,-25 0,0" dur="5s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;8;5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="280" r="4" fill="#29b6f6" opacity="0.5">
      <animateMotion path="M0,0 Q40,-50 30,-100 Q-15,-130 -50,-70 Q-70,-25 0,0" dur="6s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="340" r="3" fill="#ff5722" opacity="0.7">
      <animateMotion path="M0,0 Q-25,30 -15,70 Q30,100 55,40 Q30,-15 0,0" dur="4s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>