services:
  app:
    build: .
    container_name: task-manager
    ports:
      - "5000:5000"
    # 全部业务开关/密钥统一在 .env 维护(模板见 .env.example)
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - FLASK_ENV=production
      - PYTHONOPTIMIZE=1
    volumes:
      # 整仓挂载: 新增/删除源码文件无需再改本文件(Dockerfile 为系统级 pip, 无 venv 遮蔽问题)
      - ./:/app
      # 持久化数据用命名卷, 不随仓库走
      - task-data:/app/instance
      - task-uploads:/app/instance/uploads
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: '2'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vscode_vscode_default

volumes:
  task-data:
  task-uploads:

networks:
  vscode_vscode_default:
    external: true
