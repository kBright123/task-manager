<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img">
  <defs>
    <radialGradient id="au_geed" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fffdf0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ce93d8" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#ab47bc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8e24aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin_geed" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="60%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </radialGradient>
    <linearGradient id="mn_geed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="50%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <linearGradient id="mn_geed_shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ab47bc" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sv_geed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f3e5f5"/>
      <stop offset="70%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#ce93d8"/>
    </linearGradient>
    <linearGradient id="ac_geed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a1b9a"/>
      <stop offset="100%" stop-color="#4a0072"/>
    </linearGradient>
    <linearGradient id="timer_geed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="50%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#ba68c8"/>
    </linearGradient>
    <linearGradient id="timer_geed_primitive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <linearGradient id="timer_geed_royal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="50%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#ffd600"/>
    </linearGradient>
    <linearGradient id="timer_geed_ultimate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#4dd0ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="silver_geed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="50%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#ce93d8"/>
    </linearGradient>
    <linearGradient id="geed_claw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="50%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#ab47bc"/>
    </linearGradient>
    <filter id="glow_geed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(20,24,36,0.25)"/>
    </filter>
    <filter id="purple_glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0  0 0.5 0 0 0.5  0 0 1 0 0  0 0 0 2 0"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景光环（紫色系） -->
  <ellipse cx="200" cy="200" rx="150" ry="140" fill="url(#au_geed)">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="150;158;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="140;148;140" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 主体组 -->
  <g filter="url(#soft_shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <g transform="translate(0, 10)">
      
      <!-- 双腿（捷德特有的护腿尖刺） -->
      <g>
        <path d="M138 350 Q130 380 125 400 L148 400 Q152 380 145 350 Z" fill="url(#mn_geed)" stroke="rgba(20,24,36,0.3)" stroke-width="1.5"/>
        <path d="M138 350 Q142 370 140 385 L148 385 Q145 370 145 350 Z" fill="url(#sv_geed)"/>
        <ellipse cx="141.5" cy="390" rx="8" ry="4" fill="url(#ac_geed)"/>
        <!-- 护腿尖刺 -->
        <path d="M130 345 Q135 335 140 345 L140 360 Q135 355 130 345 Z" fill="url(#mn_geed)" opacity="0.8"/>
        <path d="M252 350 Q260 380 265 400 L242 400 Q238 380 245 350 Z" fill="url(#mn_geed)" stroke="rgba(20,24,36,0.3)" stroke-width="1.5"/>
        <path d="M252 350 Q248 370 250 385 L242 385 Q245 370 245 350 Z" fill="url(#sv_geed)"/>
        <ellipse cx="248.5" cy="390" rx="8" ry="4" fill="url(#ac_geed)"/>
        <path d="M250 345 Q255 335 260 345 L260 360 Q255 355 250 345 Z" fill="url(#mn_geed)" opacity="0.8"/>
      </g>

      <!-- 躯干主体 -->
      <path d="M120 300 Q110 260 120 220 Q125 190 150 180 Q180 170 200 170 Q220 170 250 180 Q275 190 280 220 Q290 260 280 300 Z" fill="url(#skin_geed)" stroke="rgba(20,24,36,0.15)" stroke-width="1">
        <animate attributeName="d" values="M120 300 Q110 260 120 220 Q125 190 150 180 Q180 170 200 170 Q220 170 250 180 Q275 190 280 220 Q290 260 280 300 Z;
                      M120 300 Q110 260 120 218 Q125 188 150 178 Q180 168 200 168 Q220 168 250 178 Q275 188 280 218 Q290 258 280 300 Z;
                      M120 300 Q110 260 120 220 Q125 190 150 180 Q180 170 200 170 Q220 170 250 180 Q275 190 280 220 Q290 260 280 300 Z" dur="3.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </path>

      <!-- 捷德特有的胸甲花纹（融合了雷欧/贝利亚的基因纹路） -->
      <path d="M170 240 Q200 210 230 240 Q210 255 200 265 Q190 255 170 240 Z" fill="url(#mn_geed)">
        <animate attributeName="opacity" values="1;0.85;1" dur="3.5s" repeatCount="indefinite"/>
      </path>
      <path d="M178 245 Q200 220 222 245 Q208 258 200 262 Q192 258 178 245 Z" fill="url(#mn_geed_shine)" opacity="0.7"/>
      
      <!-- 中央核心（基因纹路核心） -->
      <g id="coreUnit">
        <ellipse cx="200" cy="248" rx="18" ry="16" fill="url(#timer_geed)" stroke="#3d004a" stroke-width="2.5">
          <animate attributeName="rx" values="18;20;18" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="ry" values="16;18;16" dur="1.5s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="200" cy="248" rx="12" ry="10" fill="url(#timer_geed)" opacity="0.9">
          <animate attributeName="opacity" values="0.9;1;0.7;1;0.9" dur="1.5s" repeatCount="indefinite"/>
        </ellipse>
        <!-- DNA双螺旋纹路 -->
        <path d="M190 238 Q195 235 200 238 Q205 241 210 238 Q205 245 200 248 Q195 251 190 248 Q195 245 200 242" fill="none" stroke="#ba68c8" stroke-width="2" opacity="0.8">
          <animate attributeName="stroke-dashoffset" values="0;-30" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M190 248 Q195 245 200 242 Q205 239 210 242 Q205 235 200 232 Q195 231 190 238 Q195 235 200 238" fill="none" stroke="#ba68c8" stroke-width="1.5" opacity="0.6">
          <animate attributeName="stroke-dashoffset" values="0;30" dur="2s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- 色光定时器（紫色 -> 本能红 -> 皇者金 -> 终极青） -->
      <g id="colorTimer">
        <ellipse cx="200" cy="248" rx="22" ry="20" fill="url(#timer_geed)" stroke="#3d004a" stroke-width="3">
          <animate attributeName="rx" values="22;24;22" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="ry" values="20;22;20" dur="1.2s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="200" cy="248" rx="15" ry="13" fill="url(#timer_geed)" opacity="0.9">
          <animate attributeName="opacity" values="0.9;1;0.6;1;0.9" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="rx" values="15;17;14;17;15" dur="1.5s" repeatCount="indefinite"/>
        </ellipse>
        <animate attributeName="fill" values="url(#timer_geed);url(#timer_geed);url(#timer_geed_primitive);url(#timer_geed_royal);url(#timer_geed_ultimate);url(#timer_geed)" dur="25s" repeatCount="indefinite" begin="3s"/>
      </g>

      <!-- 胸部银色护甲条 -->
      <path d="M155 205 Q180 198 200 198 Q220 198 245 205 L240 215 Q220 210 200 210 Q180 210 160 215 Z" fill="url(#silver_geed)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" opacity="0.9"/>

      <!-- 双肩装甲（捷德特有的不对称/融合风格） -->
      <path d="M115 200 Q100 195 95 210 Q100 225 115 220 Q110 210 115 200 Z" fill="url(#mn_geed)" stroke="rgba(20,24,36,0.2)" stroke-width="1.5"/>
      <path d="M285 200 Q300 195 305 210 Q300 225 285 220 Q290 210 285 200 Z" fill="url(#mn_geed)" stroke="rgba(20,24,36,0.2)" stroke-width="1.5"/>
      <path d="M112 205 Q125 205 135 210" stroke="url(#silver_geed)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M288 205 Q275 205 265 210" stroke="url(#silver_geed)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>

      <!-- 捷德爪（右手特有） -->
      <g>
        <path d="M285 220 Q300 240 305 270 Q302 290 285 300 Q275 285 275 250 Q280 230 285 220 Z" fill="url(#skin_geed)" stroke="rgba(20,24,36,0.15)" stroke-width="1"/>
        <path d="M285 220 Q292 235 295 250 L280 250 Q278 235 285 220 Z" fill="url(#sv_geed)"/>
        <path d="M300 295 Q315 305 320 295 Q310 290 300 285 Q305 300 305 305 Q300 315 285 310 Z" fill="url(#geed_claw)" stroke="#ab47bc" stroke-width="1.5" filter="url(#purple_glow)">
          <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="2s" repeatCount="indefinite" transform-origin="300 300"/>
        </path>
        <path d="M115 220 Q100 240 95 270 Q98 290 115 300 Q125 285 125 250 Q120 230 115 220 Z" fill="url(#skin_geed)" stroke="rgba(20,24,36,0.15)" stroke-width="1"/>
        <path d="M115 220 Q108 235 105 250 L120 250 Q122 235 115 220 Z" fill="url(#sv_geed)"/>
        <path d="M100 295 Q95 310 100 320 L115 320 Q118 310 113 295 Z" fill="url(#ac_geed)"/>
      </g>

      <!-- 颈部 -->
      <path d="M170 180 L165 195 L235 195 L230 180 Z" fill="url(#skin_geed)"/>

      <!-- 头部 -->
      <g>
        <path d="M140 175 Q130 140 145 100 Q170 75 200 70 Q230 75 255 100 Q270 140 260 175 Z" fill="url(#skin_geed)" stroke="rgba(20,24,36,0.15)" stroke-width="1">
          <animate attributeName="d" values="M140 175 Q130 140 145 100 Q170 75 200 70 Q230 75 255 100 Q270 140 260 175 Z;
                        M140 175 Q130 138 145 98 Q170 73 200 68 Q230 73 255 98 Q270 138 260 175 Z;
                        M140 175 Q130 140 145 100 Q170 75 200 70 Q230 75 255 100 Q270 140 260 175 Z" dur="3.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
        </path>

        <!-- 面部护甲（捷德特有的额头三角+面部线条，带有贝利亚风格的尖锐感） -->
        <path d="M155 155 Q165 128 185 110 Q195 105 205 110 Q215 105 225 110 Q235 128 245 155" fill="none" stroke="url(#silver_geed)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <path d="M158 158 Q168 131 188 113 Q198 108 208 113 Q218 108 228 113 Q238 131 242 158" fill="none" stroke="#f3e5f5" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

        <!-- 眼睛（捷德的眼睛根据形态变色，基础为紫红色） -->
        <g>
          <ellipse cx="172" cy="132" rx="11" ry="9" fill="#1a0525" filter="url(#glow_geed)">
            <animate attributeName="ry" values="9;1;9" dur="3s" repeatCount="indefinite" begin="0.3s"/>
          </ellipse>
          <ellipse cx="172" cy="132" rx="6" ry="5" fill="#ba68c8">
            <animate attributeName="ry" values="5;0.5;5" dur="3s" repeatCount="indefinite" begin="0.3s"/>
          </ellipse>
          <ellipse cx="175" cy="130" rx="2.5" ry="2" fill="#ffffff" opacity="1"/>
          <ellipse cx="167" cy="134" rx="1" ry="0.8" fill="#ffffff" opacity="0.5"/>
          <ellipse cx="228" cy="132" rx="11" ry="9" fill="#1a0525" filter="url(#glow_geed)">
            <animate attributeName="ry" values="9;1;9" dur="3s" repeatCount="indefinite" begin="0.3s"/>
          </ellipse>
          <ellipse cx="228" cy="132" rx="6" ry="5" fill="#ba68c8">
            <animate attributeName="ry" values="5;0.5;5" dur="3s" repeatCount="indefinite" begin="0.3s"/>
          </ellipse>
          <ellipse cx="231" cy="130" rx="2.5" ry="2" fill="#ffffff" opacity="1"/>
          <ellipse cx="225" cy="134" rx="1" ry="0.8" fill="#ffffff" opacity="0.5"/>
        </g>

        <!-- 头顶装饰（捷德特有的双角+额头宝石） -->
        <path d="M175 90 Q185 55 195 90 Q192 96 185 102 Q178 96 175 90 Z" fill="url(#mn_geed)" stroke="#6a1b9a" stroke-width="1.5" filter="url(#purple_glow)">
          <animateTransform attributeName="transform" type="rotate" values="0;3;0;-3;0" dur="6s" repeatCount="indefinite"/>
        </path>
        <path d="M205 90 Q215 55 225 90 Q222 96 215 102 Q208 96 205 90 Z" fill="url(#mn_geed)" stroke="#6a1b9a" stroke-width="1.5" filter="url(#purple_glow)">
          <animateTransform attributeName="transform" type="rotate" values="0;-3;0;3;0" dur="6s" repeatCount="indefinite"/>
        </path>
        <path d="M178 93 Q188 68 195 93 Q193 98 185 98 Q177 98 178 93 Z" fill="url(#mn_geed_shine)" opacity="0.4"/>
        <path d="M208 93 Q218 68 222 93 Q219 98 215 98 Q207 98 208 93 Z" fill="url(#mn_geed_shine)" opacity="0.4"/>

        <!-- 额头宝石（紫色） -->
        <ellipse cx="200" cy="112" rx="7" ry="5" fill="#e040fb" filter="url(#purple_glow)">
          <animate attributeName="opacity" values="0.9;1;0.9" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="rx" values="7;8;7" dur="1.5s" repeatCount="indefinite"/>
        </ellipse>

        <!-- 耳部装饰（尖锐） -->
        <path d="M138 145 Q120 138 112 155 Q122 155 135 148 Q140 145 138 145 Z" fill="url(#sv_geed)" stroke="url(#silver_geed)" stroke-width="1"/>
        <path d="M262 145 Q280 138 288 155 Q278 155 265 148 Q260 145 262 145 Z" fill="url(#sv_geed)" stroke="url(#silver_geed)" stroke-width="1"/>

      </g>

      <!-- 紫色/红色/金色/青色能量粒子效果 -->
      <g opacity="0.7">
        <circle cx="170" cy="200" r="3" fill="#ba68c8">
          <animate attributeName="r" values="1;4;1" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.3;1;0" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="200;175;200" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="230" cy="200" r="3" fill="#ba68c8">
          <animate attributeName="r" values="1;4;1" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
          <animate attributeName="opacity" values="0.3;1;0" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
          <animate attributeName="cy" values="200;175;200" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
        </circle>
        <circle cx="200" cy="160" r="2" fill="#ce93d8">
          <animate attributeName="r" values="1;3;1" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.4;1;0" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="160;135;160" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="200" cy="248" r="2" fill="#ffd600">
          <animate attributeName="r" values="1;4;1" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;1;0" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="200" cy="248" r="2" fill="#ff1744">
          <animate attributeName="r" values="1;4;1" dur="1s" repeatCount="indefinite" begin="0.5s"/>
          <animate attributeName="opacity" values="0.5;1;0" dur="1s" repeatCount="indefinite" begin="0.5s"/>
        </circle>
      </g>

    </g>
  </g>

  <!-- 紫/红/金/青粒子环绕 -->
  <g filter="url(#glow_geed)">
    <circle cx="120" cy="280" r="4" fill="#ba68c8" opacity="0.5">
      <animateMotion path="M0,0 Q-30,-40 -20,-80 Q10,-100 40,-60 Q60,-20 0,0" dur="6s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="280" r="3" fill="#ff1744" opacity="0.5">
      <animateMotion path="M0,0 Q30,-40 20,-80 Q-10,-100 -40,-60 Q-60,-20 0,0" dur="7s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="340" r="2" fill="#ffd600" opacity="0.6">
      <animateMotion path="M0,0 Q-20,20 -10,50 Q20,70 40,30 Q20,-10 0,0" dur="5s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="200" r="2" fill="#00e5ff" opacity="0.5">
      <animateMotion path="M0,0 Q20,-30 10,-70 Q-15,-100 -40,-50 Q-60,-10 0,0" dur="8s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>