{% extends "base.html" %}
{% block title %}登录 - 知行合一{% endblock %}
{% block extra_css %}
<style>
  .auth-logo { background: #fff; border: 1px solid var(--gray-200); transition: background .15s, border-color .15s; --auth-bg-color: #fff; --auth-stroke-url: url(#loginGradLight); }
  .auth-logo .auth-logo-stroke { stroke: var(--auth-stroke-url); }
  [data-theme="dark"] .auth-logo { background: #1C1C1E; border-color: rgba(148, 163, 184, .25); --auth-bg-color: #1C1C1E; --auth-stroke-url: url(#loginGradDark); }
  [data-theme="dark"] .auth-logo .auth-logo-stroke { stroke: var(--auth-stroke-url); }
</style>
{% endblock %}
{% block full_content %}
<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="text-center mb-4">
            <div class="auth-logo" style="width:80px;height:80px;border-radius:50%;box-shadow:var(--shadow-sm);color:var(--gray-900);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;">
              <svg width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <defs>
                  <linearGradient id="loginGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#1B2A4A"/>
                    <stop offset="100%" stop-color="#E8843A"/>
                  </linearGradient>
                  <linearGradient id="loginGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#4A8CF7"/>
                    <stop offset="100%" stop-color="#F5A623"/>
                  </linearGradient>
                </defs>
                <!-- 知⇄行合一 · ∞ 循环渐变 + 中心白点 -->
                <path class="auth-logo-stroke" d="M9.38 16 C9.38 11 13.13 11 16 16 C18.88 21 22.63 21 22.63 16 C22.63 11 18.88 11 16 16 C13.13 21 9.38 21 9.38 16 Z" stroke="var(--auth-stroke-url)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="16" cy="16" r="1" fill="#fff"/>
              </svg>
            </div>
            <h4 class="fw-bold mb-1" style="color:var(--gray-900);">知行合一</h4>
            <p class="text-muted small mb-0">待办发布 · 进度跟踪 · 知识沉淀 · 随手记</p>
          </div>

          <!-- 正常登录 -->
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">用户名</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" value="{{ username }}" required autofocus autocomplete="username">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label">密码</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required autocomplete="current-password">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">登 录</button>
          </form>
          <div class="text-center">
            <div class="mt-2" style="font-size:.8rem;color:var(--gray-500);">
              还没有账号？<a href="{{ url_for('register') }}" style="color:var(--primary);text-decoration:none;font-weight:600;">注册账号</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
