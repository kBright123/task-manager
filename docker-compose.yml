services:
  app:
    build: .
    container_name: task-manager
    ports:
      - "5000:5000"
    volumes:
      - ./app.py:/app/app.py
      - ./kb:/app/kb
      - ./entrypoint.sh:/app/entrypoint.sh
      - ./templates:/app/templates
      - ./static:/app/static
      - task-data:/app/instance
      - task-uploads:/app/static/uploads
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - KB_OPENCODE_BASE_URL=http://host.docker.internal:4096
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vscode_vscode_default

volumes:
  task-data:
  task-uploads:

networks:
  vscode_vscode_default:
    external: true
