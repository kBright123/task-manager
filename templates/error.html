<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} - 知行合一</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #006633;
      --gray-50: #f8fafc;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-900: #0f172a;
      --danger: #ef4444;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 480px at 12% -8%, rgba(0, 102, 51, .16), transparent 62%),
        radial-gradient(720px 420px at 108% 18%, rgba(79, 70, 231, .10), transparent 58%),
        linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
    }
    .error-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, .10);
      padding: 40px 32px 34px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .error-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #f59e0b);
    }
    .error-code {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .error-message { font-size: .95rem; color: var(--gray-600); margin-bottom: 26px; }
    .error-home {
      display: inline-block;
      padding: .6rem 1.6rem;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(90deg, var(--primary), #10b981);
      text-decoration: none;
      letter-spacing: 1px;
    }
    .error-home:hover { opacity: .9; }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(900px 480px at 12% -8%, rgba(16, 185, 129, .18), transparent 62%),
          radial-gradient(720px 420px at 108% 18%, rgba(139, 92, 246, .14), transparent 58%),
          linear-gradient(180deg, #0f172a 0%, #111827 100%);
      }
      .error-card { background: #1e293b; border-color: rgba(148, 163, 184, .18); }
      .error-code { color: #34d399; }
      .error-message { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">{{ code }}</div>
    <div class="error-message">{{ message }}</div>
    <a class="error-home" href="{{ url_for('index') }}">返回首页</a>
  </div>
</body>
</html>
