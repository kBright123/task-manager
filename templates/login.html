{% extends "base.html" %}
{% block title %}登录 - 知行合一{% endblock %}
{% block full_content %}
<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <div style="width:72px;height:72px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;">
              <svg width="46" height="46" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <rect width="32" height="32" rx="7" fill="#fff"/>
                <g transform="translate(16 16)">
                  <circle r="10" fill="#006633"/>
                  <path d="M0 -10 A10 10 0 0 0 0 10 Z" fill="#fff"/>
                  <circle cx="0" cy="-5" r="5" fill="#006633"/>
                  <circle cx="0" cy="5" r="5" fill="#fff"/>
                  <circle cx="0" cy="-5" r="1.8" fill="#fff"/>
                  <circle cx="0" cy="5" r="1.8" fill="#006633"/>
                </g>
              </svg>
            </div>
            <h4 class="fw-bold mb-1" style="color:var(--gray-900);">知行合一</h4>
            <p class="text-muted small mb-0">待办发布 · 进度跟踪 · 知识沉淀 · 随手记</p>
          </div>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">用户名</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label">密码</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">登 录</button>
          </form>
          <div class="text-center">
            <a href="{{ url_for('login_guest') }}" class="btn btn-outline-secondary btn-sm w-100">
              <i class="bi bi-person-badge"></i> 体验账号（游客模式）
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
