{% extends "base.html" %}
{% block title %}数字分身 - 知行合一{% endblock %}
{% block extra_css %}
<style>
  .avatar-page { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  .avatar-header { text-align: center; margin-bottom: 20px; }
  .avatar-avatar { width: 64px; height: 64px; border-radius: 50%;
    background: var(--primary); color: #fff; display: inline-flex;
    align-items: center; justify-content: center; font-size: 1.6rem;
    margin-bottom: 8px; }
  .avatar-name { font-weight: 700; font-size: 1.1rem; }
  .avatar-desc { font-size: .82rem; color: var(--gray-500); }
  .chat-wrap { display: flex; flex-direction: column; gap: 8px;
    max-height: 60vh; overflow-y: auto; padding: 8px 0; }
  .chat-bubble { max-width: 82%; padding: 10px 14px; border-radius: 12px;
    font-size: .88rem; line-height: 1.6; word-break: break-word; }
  .chat-bubble.user { background: var(--primary); color: #fff;
    margin-left: auto; border-bottom-right-radius: 4px; }
  .chat-bubble.avatar { background: var(--gray-100); color: var(--gray-800);
    margin-right: auto; border-bottom-left-radius: 4px; }
  .chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
  .chat-input-row input { flex: 1; }
  .chat-empty { text-align: center; padding: 40px 10px; color: var(--gray-400); }
  .chat-empty i { font-size: 2rem; display: block; margin-bottom: 8px; }
  .chat-typing { color: var(--gray-400); font-size: .82rem; padding: 4px 0; }
  .source-tag { display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 100px; font-size: .7rem;
    background: var(--primary-light); color: var(--primary);
    text-decoration: none; margin: 2px; }
</style>
{% endblock %}
{% block content %}
<div class="avatar-page">
  <div class="avatar-header">
    <div class="avatar-avatar"><i class="bi bi-person-fill"></i></div>
    <div class="avatar-name">我的数字分身</div>
    <div class="avatar-desc">基于你的知识库与你对话</div>
  </div>
  <div class="chat-wrap" id="chatWrap">
    <div class="chat-empty" id="chatEmpty">
      <i class="bi bi-chat-square-text"></i>
      <div>输入问题,开始与你的数字分身对话</div>
    </div>
  </div>
  <div id="chatLoading" class="chat-typing d-none">
    <span class="spinner-sm" style="display:inline-block;"></span> 分身思考中…
  </div>
  <div class="chat-input-row">
    <input type="text" id="avatarInput" class="form-control"
           placeholder="输入你的问题…" autocomplete="off"
           onkeydown="if(event.key==='Enter')submitAvatar()">
    <button class="btn btn-primary" onclick="submitAvatar()">
      <i class="bi bi-send"></i>
    </button>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
var chatMessages = [];

function submitAvatar() {
  var input = document.getElementById('avatarInput');
  var q = input.value.trim();
  if (!q) return;
  input.value = '';
  appendBubble('user', q);
  document.getElementById('chatEmpty').style.display = 'none';
  var loading = document.getElementById('chatLoading');
  loading.classList.remove('d-none');
  fetch('{{ url_for('kb.api_avatar_ask') }}', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q })
  }).then(function (r) { return r.json(); }).then(function (d) {
    loading.classList.add('d-none');
    if (d.ok) {
      appendBubble('avatar', d.answer || '');
      (d.sources || []).forEach(function (s) {
        var a = document.createElement('a');
        a.className = 'source-tag';
        a.href = '{{ url_for('kb.doc_detail', doc_id=0) }}'.replace('0', s.doc_id);
        a.innerHTML = '<i class="bi bi-file-earmark-text"></i> ' + s.title + ' · 第' + s.page + '页';
        var wrap = document.getElementById('chatWrap');
        var last = wrap.lastElementChild;
        if (last) last.appendChild(a);
      });
    } else {
      appendBubble('avatar', d.error || '回答生成失败');
    }
  }).catch(function () {
    loading.classList.add('d-none');
    appendBubble('avatar', '网络错误,请重试');
  });
}

function appendBubble(role, text) {
  var wrap = document.getElementById('chatWrap');
  var bubble = document.createElement('div');
  bubble.className = 'chat-bubble ' + role;
  if (window.marked && window.DOMPurify) {
    bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
  } else {
    bubble.textContent = text;
    bubble.style.whiteSpace = 'pre-wrap';
  }
  wrap.appendChild(bubble);
  wrap.scrollTop = wrap.scrollHeight;
}
</script>
{% endblock %}
