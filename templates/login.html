{% extends "base.html" %}
{% block title %}登录 - 知行合一{% endblock %}
{% block full_content %}
<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <div style="width:80px;height:80px;border-radius:50%;background:#fff;border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);color:var(--gray-900);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;">
              <svg width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <defs>
                  <linearGradient id="zgl" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#00a05a"/>
                    <stop offset="1" stop-color="#006633"/>
                  </linearGradient>
                </defs>
                <rect width="32" height="32" rx="7" fill="url(#zgl)"/>
                <!-- 知: 翻开的书 -->
                <g stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 26 V14 a8 5 0 0 1 11-1 a8 5 0 0 1 11 1 V26"/>
                  <path d="M16 13 V26"/>
                </g>
                <!-- 行: 向上的箭头 -->
                <g stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 10.5 V3.5"/>
                  <path d="M11.6 7.6 L16 2.5 L20.4 7.6"/>
                </g>
              </svg>
            </div>
            <h4 class="fw-bold mb-1" style="color:var(--gray-900);">知行合一</h4>
            <p class="text-muted small mb-0">待办发布 · 进度跟踪 · 知识沉淀 · 随手记</p>
          </div>

          {% if lock_email %}
          <!-- 账号锁定:邮箱验证码解锁 / 重置密码 -->
          <div class="alert alert-warning py-2" style="font-size:.8rem;border-radius:10px;">
            <i class="bi bi-shield-lock"></i> 账号已锁定，验证通过后可继续登录或重置密码
          </div>
          <div class="d-flex align-items-center gap-2 mb-3" style="font-size:.85rem;color:var(--gray-600);">
            <i class="bi bi-envelope"></i> 解锁验证码已发送至 <b>{{ masked_email or '绑定邮箱' }}</b>
          </div>
          <form method="POST" action="{{ url_for('login_unlock') }}" id="unlockForm">
            <input type="hidden" name="username" value="{{ username }}">
            <div class="mb-3">
              <label class="form-label">解锁验证码</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="text" name="code" class="form-control" placeholder="请输入 6 位验证码" required autofocus maxlength="6" style="letter-spacing:4px;text-align:center;font-weight:600;">
              </div>
            </div>
            <div class="mb-3 d-none" id="resetPwdRow">
              <label class="form-label">新密码（可选，设置后请用新密码登录）</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="new_password" class="form-control" placeholder="至少 6 位" minlength="6">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-2">验证并解锁</button>
          </form>
          <div class="d-flex justify-content-between align-items-center">
            <a href="#" id="showResetPwdLink" style="font-size:.8rem;color:var(--primary);text-decoration:none;" onclick="toggleResetPwd();return false;">验证后同时重置密码</a>
            <form method="POST" action="{{ url_for('login_unlock_send') }}" style="display:inline;">
              <input type="hidden" name="username" value="{{ username }}">
              <button type="submit" class="btn btn-outline-secondary btn-sm" style="font-size:.75rem;">重新发送验证码</button>
            </form>
          </div>
          <hr>
          <div class="text-center">
            <a href="{{ url_for('login') }}" style="font-size:.8rem;color:var(--gray-500);text-decoration:none;"><i class="bi bi-arrow-left"></i> 返回登录</a>
          </div>
          <script>
            function toggleResetPwd() {
              var row = document.getElementById('resetPwdRow');
              var link = document.getElementById('showResetPwdLink');
              var show = row.classList.contains('d-none');
              row.classList.toggle('d-none');
              link.textContent = show ? '取消重置密码' : '验证后同时重置密码';
            }
          </script>

          {% else %}
          <!-- 正常登录 -->
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">用户名</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" value="{{ username }}" required autofocus>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label">密码</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">登 录</button>
          </form>
          <div class="text-center">
            <div class="mt-2" style="font-size:.8rem;color:var(--gray-500);">
              还没有账号？<a href="{{ url_for('register') }}" style="color:var(--primary);text-decoration:none;font-weight:600;">注册账号</a>
              <span class="mx-1">·</span>
              <span style="color:var(--gray-400);">新账号需管理员审批</span>
            </div>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
