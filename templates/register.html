{% extends "base.html" %}
{% block title %}注册 - 知行合一{% endblock %}
{% block extra_css %}
<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(0, 102, 51, .16), transparent 62%),
      radial-gradient(720px 420px at 108% 18%, rgba(79, 70, 231, .10), transparent 58%),
      linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    box-shadow: 0 16px 40px rgba(15, 23, 42, .10);
    padding: 34px 32px 30px;
    position: relative;
    overflow: hidden;
  }
  .auth-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--success));
  }
  .auth-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    text-align: center;
  }
  .auth-brand h4 { font-weight: 700; color: var(--gray-900); margin: 0; font-size: 1.2rem; letter-spacing: .5px; }
  .auth-brand p { margin: 0; font-size: .78rem; color: var(--gray-500); }
  .auth-title {
    text-align: center;
    margin-bottom: 4px;
  }
  .auth-title h1 { font-size: 1.05rem; font-weight: 700; color: var(--gray-900); margin: 0; }
  .auth-title p { font-size: .74rem; color: var(--gray-500); margin: 4px 0 0; }
  .auth-field .form-label { font-size: .8rem; font-weight: 600; color: var(--gray-700); }
  .auth-field .form-label .req { color: var(--danger); margin-left: 2px; }
  .auth-field .input-group-text { color: var(--gray-400); border-right: 0; }
  .auth-field .input-group .form-control { border-left: 0; }
  .auth-field .form-control {
    font-size: .85rem;
    padding-top: .55rem;
    padding-bottom: .55rem;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .auth-hint { font-size: .7rem; color: var(--gray-400); margin-top: 4px; }
  .auth-submit { border: none; border-radius: var(--radius-sm); padding: .72rem; font-weight: 700; letter-spacing: 2px; background: linear-gradient(90deg, var(--primary), var(--success)); box-shadow: 0 6px 16px rgba(0, 102, 51, .25); transition: box-shadow .2s, transform .15s; }
  .auth-submit:hover { box-shadow: 0 10px 22px rgba(0, 102, 51, .35); transform: translateY(-1px); }
  .auth-foot { text-align: center; margin-top: 18px; font-size: .8rem; color: var(--gray-500); }
  .auth-foot a { color: var(--primary); text-decoration: none; font-weight: 600; }
  .auth-foot a:hover { text-decoration: underline; }
  .auth-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
    font-size: .72rem;
    color: var(--gray-500);
    background: var(--gray-50);
    border: 1px dashed var(--gray-200);
    border-radius: 10px;
    padding: 8px 10px;
  }
  @media (prefers-color-scheme: dark) {
    .auth-page {
      background:
        radial-gradient(900px 480px at 12% -8%, rgba(16, 185, 129, .18), transparent 62%),
        radial-gradient(720px 420px at 108% 18%, rgba(139, 92, 246, .14), transparent 58%),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
    }
    .auth-card { background: #1e293b; border-color: rgba(148, 163, 184, .18); }
    .auth-brand h4, .auth-title h1 { color: #f1f5f9; }
    .auth-brand p, .auth-title p, .auth-foot { color: #94a3b8; }
    .auth-field .form-label { color: #cbd5e1; }
    .auth-field .form-control, .auth-field .input-group-text { background: #0f172a; border-color: rgba(148, 163, 184, .25); color: #e2e8f0; }
    .auth-field .form-control::placeholder { color: #64748b; }
    .auth-note { background: rgba(15, 23, 42, .6); border-color: rgba(148, 163, 184, .2); color: #94a3b8; }
  }
</style>
{% endblock %}
{% block full_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div style="width:80px;height:80px;border-radius:50%;background:#fff;border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);color:var(--gray-900);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;">
        <svg width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="registerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#1B2A4A"/>
              <stop offset="100%" stop-color="#E8843A"/>
            </linearGradient>
          </defs>
          <!-- 知⇄行合一 · ∞ 循环渐变 + 中心白点 -->
          <path d="M9.38 16 C9.38 11 13.13 11 16 16 C18.88 21 22.63 21 22.63 16 C22.63 11 18.88 11 16 16 C13.13 21 9.38 21 9.38 16 Z" stroke="url(#registerGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="1" fill="#fff"/>
        </svg>
      </div>
      <h4>知行合一</h4>
      <p>待办发布 · 进度跟踪 · 知识沉淀 · 随手记</p>
    </div>

    <div class="auth-title mb-4">
      <h1>创建账号</h1>
      <p>注册后需管理员审批，通过后方可登录</p>
    </div>

    <form method="POST">
      <div class="mb-3 auth-field">
        <label class="form-label">用户名<span class="req">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="2-80 个字符" value="{{ username }}" required maxlength="80" autofocus>
        </div>
        <div class="auth-hint">用于登录，注册后不可修改</div>
      </div>
      <div class="mb-3 auth-field">
        <label class="form-label">姓名<span class="req">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
          <input type="text" name="name" class="form-control" placeholder="请输入真实姓名" value="{{ name }}" required maxlength="80">
        </div>
      </div>
      <div class="mb-4 auth-field">
        <label class="form-label">密码<span class="req">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="至少 6 位" required minlength="6" autocomplete="new-password">
        </div>
        <div class="auth-hint">至少 6 位，建议使用字母、数字与符号组合</div>
      </div>
      <button type="submit" class="btn btn-primary w-100 auth-submit">注 册</button>
    </form>

    <div class="auth-note"><i class="bi bi-shield-check" style="color:var(--primary);"></i> 同一个访问 IP 地址仅允许注册一个账号</div>

    <div class="auth-foot">
      已有账号？<a href="{{ url_for('login') }}">返回登录</a>
    </div>
  </div>
</div>
{% endblock %}
