{% extends "base.html" %}
{% block title %}随手记{% endblock %}
{% block body_class %} notes-full{% endblock %}
{% block extra_css %}
<style>
  body.notes-full .app-container { max-width: none; padding: 0; }
  body.notes-full .email-reminder { display: none !important; }
  .notes-layout{display:grid;grid-template-columns:240px minmax(0,1fr) minmax(400px,480px);gap:16px;height:calc(100vh - var(--nav-height) - 16px);padding-top:16px;}
  .notes-panel{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
  @media (max-width:1023px){.notes-layout{grid-template-columns:180px 1fr;padding-top:16px;}.notes-layout>div:nth-child(3){display:none;}}
  @media (max-width:767px){body.notes-full .app-container{padding:16px 12px calc(var(--bottom-nav-height) + 12px);}.notes-layout{grid-template-columns:1fr;gap:10px;height:auto;min-height:0;padding-top:0;}.notes-layout>div:nth-child(3){display:none;}.note-timeline{max-height:none;}}
  /* 手机端: 笔记详情改为底部抽屉, 点击笔记时滑出 */
  .note-meta-drawer{display:flex;flex-direction:column;}
  .close-drawer{display:none;}
  .note-meta-actions{display:none;}
  @media (max-width:767px){
    .note-meta-drawer #metaActions{display:none !important;}
    .note-meta-actions{
      display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
      border-top:1px solid var(--gray-200);background:var(--gray-50);flex-shrink:0;
    }
    .close-drawer{
      display:inline-flex;align-items:center;justify-content:center;
      margin-left:auto;border:none;background:var(--gray-100);border-radius:50%;
      width:28px;height:28px;color:var(--gray-600);font-size:1rem;line-height:1;cursor:pointer;
    }
    .notes-layout>div.note-meta-drawer{
      display:flex;flex-direction:column;position:fixed;left:0;right:0;
      bottom:var(--bottom-nav-height, 0px);
      height:min(62vh, 520px);z-index:1200;background:#fff;
      border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.22);
      transform:translateY(110%);transition:transform .28s cubic-bezier(.22,.61,.36,1);
      border:1px solid var(--gray-200);border-bottom:none;
    }
    .notes-layout>div.note-meta-drawer.open{transform:translateY(0);}
    .note-meta-drawer .card-header{flex-shrink:0;border-radius:18px 18px 0 0;}
    .note-meta-drawer .card-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .note-meta-drawer .grip{
      flex-shrink:0;width:44px;height:5px;border-radius:3px;background:var(--gray-300);
      margin:8px auto 2px;
    }
  }
  .note-meta-mask{display:none;}
  @media (max-width:767px){
    .note-meta-mask{display:block;position:fixed;inset:0;background:rgba(20,20,30,.4);
      opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:1190;}
    .note-meta-mask.show{opacity:1;pointer-events:auto;}
  }
  @media (prefers-color-scheme: dark){
    .note-meta-drawer{background:#1C1F26;border-color:#2A2E37;}
    .note-meta-drawer .card-header,.note-meta-drawer .card-body{color:#E5E7EB;background:#1C1F26;}
    .note-meta-actions{background:#16181D;border-top-color:#2A2E37;}
    .close-drawer{background:rgba(255,255,255,.08);color:#9CA3AF;}
    .note-meta-drawer .grip{background:#3A3F4A;}
  }
  .note-timeline{flex:1;overflow-y:auto;padding:16px;}
  .note-bubble{max-width:92%;margin-bottom:14px;}
  .note-bubble .meta{font-size:.68rem;color:var(--gray-400);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .note-bubble .bubble{background:#fff;border:1px solid var(--gray-200);border-radius:12px 12px 12px 4px;padding:12px 14px;box-shadow:var(--shadow-sm);}
  .note-bubble .bbl{font-size:.84rem;color:var(--gray-700);white-space:pre-wrap;word-break:break-word;margin-top:6px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;}
  .note-bubble .bbl.expanded{-webkit-line-clamp:unset;overflow:visible;}
  .note-bubble .bbl-more{font-size:.72rem;color:var(--primary);margin-top:2px;cursor:pointer;user-select:none;}
  .pill{display:inline-block;padding:1px 8px;border-radius:100px;background:var(--primary-light);color:var(--primary);font-size:.68rem;margin-right:4px;cursor:pointer;}
  .sys-bubble{display:inline-flex;align-items:center;gap:6px;background:#fef3c7;color:#92400e;font-size:.74rem;border-radius:10px;padding:6px 12px;margin:4px 0;}
  .note-tag{padding:4px 10px;font-size:.72rem;border-radius:100px;background:var(--gray-100);cursor:pointer;margin:2px;}
  .note-tag.active{background:var(--primary);color:#fff;}
  .note-bubble.focus-flash{border-radius:12px;animation:focusFlash 1.8s ease;}
  @keyframes focusFlash{0%,55%{background:#eef2ff;}100%{background:transparent;}}
  .note-img{max-width:220px;max-height:220px;border-radius:8px;margin:6px 0;cursor:pointer;box-shadow:var(--shadow-sm);}
  .notes-meta-body .note-img{max-width:100%;max-height:420px;}
  .note-link{color:var(--primary);text-decoration:underline;text-underline-offset:2px;word-break:break-all;}
  .note-link:hover{color:var(--primary-dark, #4338ca);text-decoration:underline;}
  .note-attach{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;margin:3px 0;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;color:var(--gray-700);text-decoration:none;font-size:.78rem;word-break:break-all;vertical-align:middle;}
  .note-attach:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary);text-decoration:none;}
  .note-attach i{flex-shrink:0;color:var(--primary);}
</style>
{% endblock %}

{% block content %}
<div class="notes-layout">
  <!-- 左栏: 笔记标签 -->
  <div class="card h-100 d-flex flex-column" style="border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;">
    <div class="card-header py-2 px-3">
      <span style="font-size:.84rem;font-weight:600;"><i class="bi bi-tags" style="color:var(--primary);"></i> 笔记标签</span>
    </div>
    <div class="card-body py-2 px-2" style="overflow-y:auto;flex:1;">
      <div id="tagList" class="d-flex flex-wrap gap-1 mt-1"></div>
    </div>
  </div>

  <!-- 中栏: 对话流 -->
  <div class="notes-panel">
    <div class="card-header d-flex justify-content-between align-items-center py-2 px-3">
      <span style="font-weight:600;font-size:.85rem;"><i class="bi bi-journal-text" style="color:var(--primary);"></i> 笔记列表</span>
      <small class="text-muted" style="font-size:.72rem;" id="notesCount"></small>
    </div>
    <div class="note-timeline" id="noteTimeline"></div>
    <div class="card-footer" style="background:#fafafa;border-top:1px solid var(--gray-100);padding:12px 14px 16px;">
      <div id="noteImgPreview" style="display:none;margin-bottom:8px;"></div>
      <div class="d-flex align-items-end gap-2">
        <button class="btn btn-sm btn-outline-secondary" id="attachBtn" type="button" title="上传附件(word/ppt/pdf/excel等)" onclick="document.getElementById('noteFileInput').click()" style="flex-shrink:0;border-radius:10px;"><i class="bi bi-paperclip"></i></button>
        <input type="file" id="noteFileInput" multiple style="display:none;">
        <textarea id="noteInput" rows="1" class="form-control form-control-sm" style="font-size:.85rem;resize:none;border-radius:10px;overflow-y:auto;" placeholder="写一条新笔记，可粘贴/拖拽图片或上传附件，保存后可在右侧详情中打标签。"></textarea>
        <button class="btn btn-sm btn-primary" id="sendNoteBtn" onclick="sendNote()" disabled style="flex-shrink:0"><i class="bi bi-send"></i> 保存笔记</button>
      </div>
    </div>
  </div>

  <!-- 右栏: 元数据抽屉(手机端滑出) -->
  <div class="note-meta-mask" id="metaMask" onclick="closeMetaDrawer()"></div>
  <div class="card h-100 note-meta-drawer" id="metaPanel" style="border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;">
    <div class="grip"></div>
    <div class="card-header py-2 px-3 d-flex align-items-center gap-2" style="font-weight:600;font-size:.85rem;">
      <i class="bi bi-info-circle" style="color:var(--primary);"></i> 笔记详情
      <span id="metaActions" style="display:none;" class="d-flex gap-1 ms-auto">
        <button type="button" class="btn btn-sm btn-outline-primary" style="font-size:.72rem;padding:1px 10px;" onclick="editNoteInline()"><i class="bi bi-pencil"></i> 编辑</button>
        <button type="button" class="btn btn-sm btn-outline-danger" style="font-size:.72rem;padding:1px 10px;" onclick="delNote(curMeta&&curMeta.id)"><i class="bi bi-trash"></i> 删除</button>
      </span>
      <button type="button" class="close-drawer" onclick="closeMetaDrawer()" title="关闭"><i class="bi bi-x"></i></button>
    </div>
    <div class="card-body" id="metaBody" style="font-size:.8rem;color:var(--gray-600);overflow-y:auto;">
      <div style="text-align:center;color:var(--gray-400);padding:40px 0;">在中间列表点一条笔记查看详情<br>或在下框输入内容，点「保存笔记」存为一条新记录</div>
    </div>
    <div class="note-meta-actions" id="metaActionsBar">
      <button type="button" class="btn btn-sm btn-outline-primary" style="flex:1;" onclick="editNoteInline()"><i class="bi bi-pencil"></i> 编辑</button>
      <button type="button" class="btn btn-sm btn-outline-danger" style="flex:1;" onclick="delNote(curMeta&&curMeta.id)"><i class="bi bi-trash"></i> 删除</button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
var curTag='', curQ='';
var focusId = {{ note_id or 'null' }};
function focusNote(){
  if(!focusId) return;
  var el=document.querySelector('.note-bubble[data-nid="'+focusId+'"]');
  if(!el){focusId=null;return;}
  focusId=null;
  el.classList.add('focus-flash');
  el.scrollIntoView({block:'center',behavior:'smooth'});
  showMeta(el.getAttribute('data-nid'));
  setTimeout(function(){el.classList.remove('focus-flash');},1800);
}
// esc 使用 base.html 提供的全局实现
function renderContent(html){
  return html.replace(/!\[([^\]]*)\]\(([^)\s]+)\)|\[([^\]]*)\]\((https?:\/\/[^)\s]+|\/notes\/attachments\/[^)\s]+)\)|(https?:\/\/[^\s<>"'，。；：、！？（）【】\[\]]+)/g,function(m,alt,imgUrl,txt,lnkUrl,plainUrl){
    if(imgUrl!==undefined){
      if(imgUrl.charAt(0)!=='/'&&!/^https?:\/\//i.test(imgUrl)) return m;
      return '<img src="'+esc(imgUrl)+'" alt="'+esc(alt)+'" loading="lazy" class="note-img" onclick="window.open(this.src)">';
    }
    if(lnkUrl!==undefined){
      var label=esc(txt||lnkUrl);
      if(lnkUrl.indexOf('/notes/attachments/')===0){
        return '<a href="'+esc(lnkUrl)+'" target="_blank" rel="noopener" class="note-attach"><i class="bi bi-paperclip"></i><span>'+label+'</span></a>';
      }
      return '<a href="'+esc(lnkUrl)+'" target="_blank" rel="noopener" class="note-link">'+label+'</a>';
    }
    if(plainUrl!==undefined){
      return '<a href="'+esc(plainUrl)+'" target="_blank" rel="noopener" class="note-link">'+esc(plainUrl)+'</a>';
    }
    return m;
  });
}
function insertAtCursor(el,text){
  var start=el.selectionStart,end=el.selectionEnd;
  el.value=el.value.slice(0,start)+text+el.value.slice(end);
  el.selectionStart=el.selectionEnd=start+text.length;
  el.dispatchEvent(new Event('input'));
  el.focus();
}
var imgCounter=0;
var pendingImages=[];
function activeNoteTextarea(){
  var el=document.getElementById('metaEditContent');
  return el||document.getElementById('noteInput');
}
function activeImgPreviewBox(){
  var el=document.getElementById('editImgPreview');
  return el||document.getElementById('noteImgPreview');
}
function queueNoteImage(file){
  var token='[[img:'+(++imgCounter)+']]';
  var blob=URL.createObjectURL(file);
  pendingImages.push({file:file, blob:blob, token:token, name:file.name||'图片'});
  insertAtCursor(activeNoteTextarea(),token);
  renderImgPreview();
}
function uploadNoteAttachment(file){
  var btn=document.getElementById('sendNoteBtn');
  var orig=btn?btn.innerHTML:null;
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm" style="width:.75rem;height:.75rem;"></span> 上传中...';}
  var fd=new FormData();
  fd.append('file',file,file.name||('attachment'));
  fetch('/notes/api/upload_attachment',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){
    if(btn){btn.disabled=false;btn.innerHTML=orig;}
    if(d.ok){
      var safeName=String(d.name||'附件').replace(/[\[\]\r\n]/g,' ').trim();
      var md='\n[📎 '+safeName+']('+d.url+')\n';
      insertAtCursor(activeNoteTextarea(),md);
      if(window.toast)toast('附件已插入:'+d.name,'success');
    }else{
      if(window.toast)toast(d.error||'附件上传失败','danger');
    }
  }).catch(function(){
    if(btn){btn.disabled=false;btn.innerHTML=orig;}
    if(window.toast)toast('附件上传失败，请重试','danger');
  });
}
function pickNoteAttachments(files){
  if(!files||!files.length) return;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(f.type&&f.type.indexOf('image')===0){queueNoteImage(f);}
    else{uploadNoteAttachment(f);}
  }
}
function renderImgPreview(){
  var box=activeImgPreviewBox();
  if(!box) return;
  if(!pendingImages.length){box.style.display='none';box.innerHTML='';return;}
  box.style.display='flex';
  box.style.flexWrap='wrap';
  box.style.gap='8px';
  box.innerHTML=pendingImages.map(function(p,i){
    return '<span style="position:relative;display:inline-block;">'+
      '<img src="'+p.blob+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--gray-200);">'+
      '<button type="button" onclick="removePendingImage('+i+')" title="移除" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;line-height:1;font-size:.7rem;border-radius:50%;border:none;background:var(--danger);color:#fff;padding:0;">&times;</button>'+
      '</span>';
  }).join('');
}
function removePendingImage(i){
  var p=pendingImages[i];
  if(!p) return;
  var ta=activeNoteTextarea();
  ta.value=ta.value.replace(p.token,'');
  ta.dispatchEvent(new Event('input'));
  if(p.blob) URL.revokeObjectURL(p.blob);
  pendingImages.splice(i,1);
  renderImgPreview();
}
function clearPendingImages(){
  pendingImages.forEach(function(p){if(p.blob) URL.revokeObjectURL(p.blob);});
  pendingImages=[];renderImgPreview();
}
function bindNotePasteDrop(el){
  if(!el) return;
  el.addEventListener('paste',function(e){
    var items=e.clipboardData&&e.clipboardData.items;
    if(!items) return;
    var imgs=[];
    for(var i=0;i<items.length;i++){
      if(items[i].type&&items[i].type.indexOf('image')===0){
        var file=items[i].getAsFile();
        if(file) imgs.push(file);
      }
    }
    if(!imgs.length) return;
    e.preventDefault();
    var text=e.clipboardData.getData('text/plain');
    if(text&&text.trim()) insertAtCursor(el,text.trim()+'\n');
    imgs.forEach(function(file){queueNoteImage(file);});
  });
  el.addEventListener('dragover',function(e){e.preventDefault();});
  el.addEventListener('drop',function(e){
    var files=e.dataTransfer&&e.dataTransfer.files;
    if(!files||!files.length) return;
    e.preventDefault();
    pickNoteAttachments(files);
  });
}
function toggleNoteText(e,link){
  e.stopPropagation();
  var b=link.parentElement.querySelector('.bbl');
  if(!b) return;
  var expanded=b.classList.toggle('expanded');
  link.innerHTML=expanded?'收起':'… 点击查看全文';
}
function renderNotes(list){
  var tl=document.getElementById('noteTimeline');
  document.getElementById('notesCount').textContent='共 '+list.length+' 条';
  if(!list.length){tl.innerHTML='<div class="empty-state">'+
    '<svg viewBox="0 0 96 96" fill="none"><path d="M30 12h30l14 14v58H30z" fill="var(--gray-100)" stroke="var(--gray-300)" stroke-width="2"/><path d="M59 13v15h14" fill="var(--gray-100)" stroke="var(--gray-300)" stroke-width="2"/><path d="M40 44h26M40 56h26M40 68h18" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/></svg>'+
    '<div class="es-title">还没有笔记</div>'+
    '<div class="es-sub">在下方输入框写一条记录，保存后可在右侧详情中打标签。</div>'+
    '<button class="btn btn-sm btn-primary" onclick="document.getElementById(\'noteInput\').focus()"><i class="bi bi-pencil-square"></i> 开始记录</button>'+
    '</div>';return;}
  tl.innerHTML=list.map(function(n){
    var tags=(n.tags||[]).map(function(t){return '<span class="pill" onclick="loadByTag(\''+esc(t)+'\')">'+esc(t)+'</span>';}).join('');
    return '<div class="note-bubble" data-nid="'+n.id+'"><div class="meta"><i class="bi bi-clock"></i> '+esc(n.created_at)+
      ' <span style="cursor:pointer;" onclick="showMeta('+n.id+',true)"><i class="bi bi-pencil"></i></span>'+
      ' <span style="cursor:pointer;" onclick="delNote('+n.id+')"><i class="bi bi-trash" style="color:var(--danger);"></i></span></div>'+
      '<div class="bubble" onclick="showMeta('+n.id+',true)">'+
      (tags?'<div class="mb-2">'+tags+'</div>':'')+
      '<div class="bbl">'+renderContent(esc(n.content))+'</div>'+
      ((n.content||'').length>160?'<div class="bbl-more" onclick="toggleNoteText(event,this)">… 点击查看全文</div>':'')+
      '</div></div>';
  }).join('');
  if(focusId){ focusNote(); return; }
  focusNote();
  var keep=curMeta&&list.some(function(x){return x.id===curMeta.id;});
  if(!keep){
    setMetaEmpty();
    if(list.length) showMeta(list[0].id);
  }
}
function loadNotes(){
  curTag='';
  fetch('/notes/api/notes').then(r=>r.json()).then(function(d){if(d.ok)renderNotes(d.notes);});
  loadTags();
}
function loadByTag(tag){
  curTag=tag;
  fetch('/notes/api/notes?tag='+encodeURIComponent(tag)).then(r=>r.json()).then(function(d){if(d.ok)renderNotes(d.notes);});
  loadTags();
}
// 初始进入: 默认选中最近一条笔记的第一个标签(无标签则显示全部); 带 note_id 跳转时保持全部列表以便定位
function initDefaultTag(){
  if(focusId){loadNotes();return;}
  fetch('/notes/api/notes').then(r=>r.json()).then(function(d){
    if(!d.ok)return;
    var first=(d.notes||[])[0];
    var t=first&&first.tags&&first.tags[0];
    if(t){loadByTag(t);}else{renderNotes(d.notes);loadTags();}
  }).catch(function(){loadNotes();});
}
function loadTags(){
  var box=document.getElementById('tagList');
  if(!box) return;
  fetch('/notes/api/notes').then(r=>r.json()).then(function(d){
    var tagSet={};
    (d.notes||[]).forEach(function(n){(n.tags||[]).forEach(function(t){tagSet[t]=1;});});
    var tags=Object.keys(tagSet).sort();
    var html='<span class="note-tag'+(curTag===''?' active':'')+'" onclick="loadNotes()">全部笔记</span>';
    if(!tags.length){box.innerHTML=html;return;}
    box.innerHTML=html+tags.map(function(t){
      return '<span class="note-tag'+(curTag===t?' active':'')+'" onclick="loadByTag(\''+esc(t).replace(/'/g,"\\'")+'\')">'+esc(t)+'</span>';
    }).join('');
  });
}
function uploadPendingImages(content){
  var imgs=pendingImages.slice();
  var replacements=[];
  var chain=Promise.resolve();
  imgs.forEach(function(p){
    chain=chain.then(function(){
      var fd=new FormData();
      fd.append('file',p.file,p.file.name||('paste_'+Date.now()+'.png'));
      return fetch('/notes/api/upload_image',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){
        if(d.ok){replacements.push({token:p.token, md:'\n!['+p.name+']('+d.url+')\n'});}
        else{throw new Error(d.error||'图片上传失败');}
      });
    });
  });
  return chain.then(function(){
    var out=content;
    replacements.forEach(function(r){out=out.replace(r.token,r.md);});
    return out;
  });
}
function sendNote(){
  var content=document.getElementById('noteInput').value.trim();
  if(!content)return;
  var btn=document.getElementById('sendNoteBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm" style="width:.75rem;height:.75rem;"></span> 保存中...';}
  var tags=curTag?[curTag]:[];
  uploadPendingImages(content).then(function(finalContent){
    return fetch('/notes/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content:finalContent,tags:tags})}).then(function(r){return r.json();});
  }).then(function(d){
    if(d.ok){
      clearPendingImages();
      document.getElementById('noteInput').value='';
      document.getElementById('noteInput').dispatchEvent(new Event('input'));
      if(window.toast) toast('已保存','success');
      if(d.duplicates&&d.duplicates.length){
        showSys('<i class="bi bi-exclamation-triangle"></i> 疑似与「'+esc(d.duplicates[0].title)+'」('+esc(d.duplicates[0].date)+') 高度相似,相似度 '+d.duplicates[0].similarity+'%');
      }
      if(curTag){ loadByTag(curTag); } else { loadNotes(); }
    } else { if (window.toast) toast(d.error||'保存失败','danger'); else alert(d.error||'保存失败'); }
    if(btn){btn.disabled=false;btn.innerHTML='<i class="bi bi-send"></i> 保存笔记';}
  }).catch(function(e){
    var msg=(e&&e.message)?e.message:'网络错误，请重试';
    if (window.toast) toast(msg,'danger'); else alert(msg);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="bi bi-send"></i> 保存笔记';}
  });
}
function showSys(html){
  var tl=document.getElementById('noteTimeline');
  var div=document.createElement('div');div.style.textAlign='center';div.innerHTML='<span class="sys-bubble">'+html+'</span>';
  tl.insertBefore(div,tl.firstChild);
}
var curMeta=null;
function showMeta(id, tap){
  fetch('/notes/api/notes').then(r=>r.json()).then(function(d){
    var n=d.notes.filter(function(x){return x.id===id;})[0];
    if(!n)return;
    curMeta=n;
    renderMeta();
    if(tap && window.innerWidth<=767) openMetaDrawer();
  });
}
function openMetaDrawer(){
  var p=document.getElementById('metaPanel'),m=document.getElementById('metaMask');
  if(p) p.classList.add('open');
  if(m) m.classList.add('show');
}
function closeMetaDrawer(){
  var p=document.getElementById('metaPanel'),m=document.getElementById('metaMask');
  if(p) p.classList.remove('open');
  if(m) m.classList.remove('show');
}
function renderMeta(){
  var n=curMeta;if(!n)return;
  var b=document.getElementById('metaBody');
  b.innerHTML=
    '<div class="notes-meta-body" style="font-size:.8rem;color:var(--gray-700);word-break:break-word;background:var(--gray-50);border-radius:8px;padding:10px 12px;">'+renderContent(esc(n.content))+'</div>'+
    '<div class="mt-2 text-muted" style="font-size:.72rem;">创建 '+esc(n.created_at)+' · 版本 v'+n.version+'</div>'+
    '<div class="mt-3"><span class="text-muted" style="font-size:.72rem;">标签</span>'+
    '<div class="d-flex flex-wrap gap-1 mt-1">'+
      (n.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+' <span style="cursor:pointer;" onclick="removeMetaTag(\''+esc(t).replace(/'/g,"\\'")+'\')" title="移除标签" class="text-muted">&times;</span></span>';}).join('')+
      '<span class="text-muted" style="font-size:.7rem;align-self:center;'+(n.tags&&n.tags.length?'':'')+'"></span>'+
    '</div>'+
    '<div class="input-group input-group-sm mt-2" style="max-width:230px;">'+
      '<input class="form-control" id="metaTagInput" placeholder="添加标签...">'+
      '<button class="btn btn-outline-secondary" type="button" onclick="addMetaTag()">添加</button>'+
    '</div></div>';
  var ma=document.getElementById('metaActions');
  if(ma) ma.style.display='inline-flex';
  var bar=document.getElementById('metaActionsBar');
  if(bar) bar.style.display=(window.innerWidth<=767)?'flex':'none';
}
function saveMetaTags(){
  var id=curMeta.id;
  fetch('/notes/api/notes/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({tags:curMeta.tags||[]})}).then(r=>r.json()).then(function(d){
      if(d.ok){curMeta=d.note;renderMeta();loadNotes();if(window.toast)toast('标签已更新','success');}
      else{if(window.toast)toast(d.error||'保存失败','danger');}
    });
}
function addMetaTag(){
  var inp=document.getElementById('metaTagInput');var v=(inp.value||'').trim();if(!v)return;
  if(!curMeta.tags)curMeta.tags=[];
  if(curMeta.tags.indexOf(v)<0){curMeta.tags.push(v);saveMetaTags();}
  inp.value='';
}
function removeMetaTag(t){
  if(!curMeta.tags)return;
  curMeta.tags=curMeta.tags.filter(function(x){return x!==t;});saveMetaTags();
}
function editNoteInline(){
  var n=curMeta;if(!n)return;
  var b=document.getElementById('metaBody');
  var bar=document.getElementById('metaActionsBar');
  if(bar) bar.style.display='none';
  b.innerHTML='<label class="text-muted" style="font-size:.72rem;">编辑内容</label>'+
    '<div id="editImgPreview" style="display:none;margin-bottom:8px;"></div>'+
    '<textarea class="form-control" id="metaEditContent" rows="10" style="font-size:.85rem;">'+esc(n.content)+'</textarea>'+
    '<div class="mt-2 d-flex align-items-center gap-2">'+
      '<button class="btn btn-sm btn-outline-secondary" type="button" title="上传附件(word/ppt/pdf/excel等)" onclick="document.getElementById(\'editFileInput\').click()"><i class="bi bi-paperclip"></i></button>'+
      '<input type="file" id="editFileInput" multiple style="display:none;">'+
      '<button class="btn btn-sm btn-primary" onclick="saveEditInline()">保存</button>'+
      '<button class="btn btn-sm btn-outline-secondary" onclick="cancelEditInline()">取消</button>'+
    '</div>';
  document.getElementById('editFileInput').addEventListener('change',function(e){
    pickNoteAttachments(e.target.files);
    e.target.value='';
  });
  bindNotePasteDrop(document.getElementById('metaEditContent'));
  document.getElementById('metaEditContent').focus();
}
function cancelEditInline(){
  clearPendingImages();
  renderMeta();
}
function saveEditInline(){
  var content=document.getElementById('metaEditContent').value;
  uploadPendingImages(content).then(function(finalContent){
    return fetch('/notes/api/notes/'+curMeta.id,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content:finalContent})}).then(function(r){return r.json();});
  }).then(function(d){
      if(d.ok){clearPendingImages();curMeta=d.note;renderMeta();loadNotes();if(window.toast)toast('笔记已更新','success');}
      else{alert(d.error||'保存失败');}
    });
}
function delNote(id){
  if(!confirm('确认删除该笔记?'))return;
  fetch('/notes/api/notes/'+id,{method:'DELETE'}).then(r=>r.json()).then(function(d){
    if(d.ok){ if(curMeta&&curMeta.id===id){setMetaEmpty();} loadNotes(); }
  });
}
function setMetaEmpty(){
  curMeta=null;
  closeMetaDrawer();
  var b=document.getElementById('metaBody');
  if(b) b.innerHTML='<div style="text-align:center;color:var(--gray-400);padding:40px 0;">在中间列表点一条笔记查看详情<br>或在下框输入内容，点「保存笔记」存为一条新记录</div>';
  var ma=document.getElementById('metaActions');
  if(ma) ma.style.display='none';
  var bar=document.getElementById('metaActionsBar');
  if(bar) bar.style.display='none';
}
var noteInputEl=document.getElementById('noteInput');
function autoResizeNoteInput(){
  if(!noteInputEl) return;
  noteInputEl.style.height='auto';
  noteInputEl.style.height=Math.min(noteInputEl.scrollHeight,160)+'px';
}
document.getElementById('noteInput').addEventListener('input',function(e){
  var btn=document.getElementById('sendNoteBtn');
  if(btn) btn.disabled=!e.target.value.trim();
  autoResizeNoteInput();
});
document.getElementById('noteFileInput').addEventListener('change',function(e){
  pickNoteAttachments(e.target.files);
  e.target.value='';
});
bindNotePasteDrop(noteInputEl);
autoResizeNoteInput();
initDefaultTag();
</script>
{% endblock %}
